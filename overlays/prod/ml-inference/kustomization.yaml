apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notebook-rental

resources:
  - ../../../apps/ml-inference/base

# CI(코드 repo의 release 워크플로)가 newTag 를 git SHA로 바꿔 커밋한다. 손으로 바꾸지 않는다.
images:
  - name: ghcr.io/notebook-rental/ml-inference
    newTag: ce90eb9a5889ead8e06dbfbb3e4e0252217a6025

patches:
  # MinIO 호스트 storage.java21.net 을 클러스터 안에서는 10.116.64.12로 보낸다(marco 요청, 2026-11-04. 처음 적은 .20은 틀린 주소였다).
  # 파드의 /etc/hosts 에 직접 적으므로 MINIO_ENDPOINT(Rancher Secret)는 호스트 이름 그대로 둔다.
  # ml은 DB에 접속하지 않으므로 s3.java21.net 은 넣지 않는다. 10.x 는 사설 주소라 밖에서는 닿지 않는다.
  - target:
      kind: Deployment
      name: ml-inference
    patch: |-
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: 10.116.64.12
            hostnames:
              - storage.java21.net
  # ghcr 패키지가 Private인 동안 이미지를 받으려면 로그인 정보가 필요하다. Rancher에서 만든 Secret ghcr-pull 을 쓴다.
  # 패키지를 Public으로 바꿔도 그대로 둬도 된다(Secret이 없어도 공개 이미지는 받는다).
  - target:
      kind: Deployment
      name: ml-inference
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
