apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notebook-rental

resources:
  - ../../../apps/web/base

# CI(코드 repo의 release 워크플로)가 newTag 를 git SHA로 바꿔 커밋한다. 손으로 바꾸지 않는다.
images:
  - name: ghcr.io/notebook-rental/web
    newTag: b3880a7f3202944ba3f80ac8a8e7cc5c70b47aa2

patches:
  # ghcr 패키지가 Private인 동안 이미지를 받으려면 로그인 정보가 필요하다. Rancher에서 만든 Secret ghcr-pull 을 쓴다.
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
