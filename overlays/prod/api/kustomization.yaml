apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notebook-rental

resources:
  - ../../../apps/api/base

# CI(코드 repo의 release 워크플로)가 newTag 를 git SHA로 바꿔 커밋한다. 손으로 바꾸지 않는다.
images:
  - name: ghcr.io/notebook-rental/api
    newTag: c02c8873c2711f9cacd2426340a3524accaebaef

patches:
  # api repo가 Private인 동안만 필요한 이미지 받기용 비밀값(Rancher에서 만든 ghcr-pull).
  # 이 Secret이 없어도 파드는 뜬다(공개 이미지면 그냥 받는다). api를 Public으로 바꾸면 이 패치를 지운다.
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
  # DB 호스트 s3.java21.net 을 클러스터 안에서는 10.116.64.13 으로 보낸다(marco 요청, 2026-11-04).
  # 일반 DNS는 다른 주소(10.116.64.11)를 돌려주므로, 파드의 /etc/hosts 에 직접 적는다(hostAliases).
  # DB_URL(Rancher Secret)은 호스트 이름 그대로 두면 된다. 10.x 는 사설 주소라 밖에서는 닿지 않는다.
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: 10.116.64.13
            hostnames:
              - s3.java21.net
