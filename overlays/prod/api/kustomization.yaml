apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notebook-rental

resources:
  - ../../../apps/api/base

# CI(코드 repo의 release 워크플로)가 newTag 를 git SHA로 바꿔 커밋한다. 손으로 바꾸지 않는다.
images:
  - name: ghcr.io/notebook-rental/api
    newTag: cd2a0e3a4c85dfa60847ad1b2971ccf9dd9bdb3b

patches:
  # api repo가 Private인 동안만 필요한 이미지 받기용 비밀값(Rancher에서 만든 ghcr-pull).
  # 이 Secret이 없어도 파드는 뜬다(공개 이미지면 그냥 받는다). api를 Public으로 바꾸면 이 패치를 지운다.
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
  # 클러스터 안에서는 외부 서비스 호스트를 사설 주소로 보낸다(marco 요청, 2026-11-04. 처음 적은 .20은 틀린 주소였다).
  #   DB    s3.java21.net      → 10.116.64.13
  #   MinIO storage.java21.net → 10.116.64.12
  # 일반 DNS는 다른 주소를 돌려주므로, 파드의 /etc/hosts 에 직접 적는다(hostAliases).
  # DB_URL, MINIO_ENDPOINT(Rancher Secret)는 호스트 이름 그대로 두면 된다. 10.x 는 사설 주소라 밖에서는 닿지 않는다.
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: 10.116.64.13
            hostnames:
              - s3.java21.net
          # MinIO 호스트 storage.java21.net 은 클러스터 안에서 10.116.64.12로(marco 요청, 2026-11-04. 처음 적은 .20은 틀린 주소였다).
          - ip: 10.116.64.12
            hostnames:
              - storage.java21.net
