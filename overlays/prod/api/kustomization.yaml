apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notebook-rental

resources:
  - ../../../apps/api/base

# CI(코드 repo의 release 워크플로)가 newTag 를 git SHA로 바꿔 커밋한다. 손으로 바꾸지 않는다.
images:
  - name: ghcr.io/notebook-rental/api
    newTag: e5b97789229893d87d4bd427c204aaf3d4b45209

patches:
  # api repo가 Private인 동안만 필요한 이미지 받기용 비밀값(Rancher에서 만든 ghcr-pull).
  # 이 Secret이 없어도 파드는 뜬다(공개 이미지면 그냥 받는다). api를 Public으로 바꾸면 이 패치를 지운다.
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
