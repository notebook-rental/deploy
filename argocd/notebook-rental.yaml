# 맨 처음 한 번만 클러스터에 직접 등록하는 "부모" Application(app-of-apps 방식).
# 이 부모는 argocd/apps 폴더를 보고 api, web, ml-inference, ingress 네 개의 "자식" Application을 만든다.
# 등록 방법은 docs/argocd.md 를 본다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notebook-rental
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/notebook-rental/deploy.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
