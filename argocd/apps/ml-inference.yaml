apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notebook-rental-ml-inference
  namespace: argocd
spec:
  project: notebook-rental
  source:
    repoURL: https://github.com/notebook-rental/deploy.git
    targetRevision: main
    path: overlays/prod/ml-inference
  destination:
    server: https://kubernetes.default.svc
    # 네임스페이스는 Rancher에서 미리 만든다(Secret을 먼저 넣어야 하므로). Argo CD는 만들지 않는다.
    namespace: notebook-rental
  syncPolicy:
    # deploy repo의 main이 바뀌면 자동으로 반영하고(automated),
    # repo에서 지운 리소스는 클러스터에서도 지우고(prune),
    # 누가 클러스터에서 손으로 바꾸면 repo 상태로 되돌린다(selfHeal).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
