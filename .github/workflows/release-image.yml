# 코드 repo(api, web, ml)가 불러 쓰는 "재사용 워크플로".
# 하는 일: 이미지 빌드 → ghcr.io/notebook-rental/<app>:<git SHA> 로 push → 이 deploy repo의
# overlays/prod/<app>/kustomization.yaml 이미지 태그를 그 SHA로 바꿔 커밋 → Argo CD가 자동 반영.
#
# 부르는 쪽 예시와 설명: docs/ci-release.md
name: release-image

on:
  workflow_call:
    inputs:
      app:
        description: "앱 이름: api, web, ml-inference 중 하나"
        required: true
        type: string
      context:
        description: "docker build 경로(기본: repo 루트)"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile 경로(기본: <context>/Dockerfile)"
        required: false
        type: string
        default: ""
    secrets:
      DEPLOY_REPO_TOKEN:
        description: "notebook-rental/deploy 에 커밋할 수 있는 토큰(Contents: Read and write)"
        required: true

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    # 같은 앱의 배포가 겹치면 먼저 시작한 것을 끝까지 하고 다음 것을 한다.
    concurrency:
      group: release-${{ inputs.app }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      APP: ${{ inputs.app }}
      IMAGE: ghcr.io/notebook-rental/${{ inputs.app }}
      TAG: ${{ github.sha }}
    steps:
      - name: 앱 이름 확인
        run: |
          case "$APP" in
            api|web|ml-inference) ;;
            *) echo "알 수 없는 app: $APP (api, web, ml-inference 중 하나)"; exit 1 ;;
          esac

      - name: 코드 받기
        uses: actions/checkout@v4

      - name: ghcr.io 로그인(Actions 기본 토큰)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드와 push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          # 패키지를 코드 repo와 연결한다(권한·공개 설정이 repo를 따라감).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

      - name: deploy repo 받기
        uses: actions/checkout@v4
        with:
          repository: notebook-rental/deploy
          ref: main
          path: deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: 이미지 태그 갱신 커밋
        working-directory: deploy
        env:
          SOURCE: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "notebook-rental-bot"
          git config user.email "notebook-rental-bot@users.noreply.github.com"
          # 다른 repo의 배포와 동시에 push 하면 충돌할 수 있어 최대 5번 다시 시도한다.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # newTag 한 줄만 바꾼다(검사기와 같은 repo의 tools/bump_image_tag.py, 테스트 있음).
            python3 -m tools.bump_image_tag "$APP" "$TAG"
            if git diff --quiet; then
              echo "이미 ${TAG} 입니다. 바꿀 것이 없습니다."
              exit 0
            fi
            git commit -am "deploy(${APP}): ${TAG::12} (${SOURCE})"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "deploy repo에 push 하지 못했습니다"
          exit 1
