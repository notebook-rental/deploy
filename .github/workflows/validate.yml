# deploy repo 자체의 검사. PR과 main push 마다 돈다.
# 1) 규칙 검사기 테스트(커버리지 80% 미만이면 실패)
# 2) kustomize build + kubeconform 스키마 검사
# 3) 규칙 검사기로 실제 overlays 검사
# 4) 워크플로 파일 문법 검사(actionlint)
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: "5.4.3"
  KUBECONFORM_VERSION: "0.6.7"
  ACTIONLINT_VERSION: "1.7.1"
  K8S_VERSION: "1.30.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kustomize 설치
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 테스트(커버리지 80% 이상)
        run: pytest
      - name: 규칙 검사(overlays/prod/*)
        run: python -m tools.check_manifests

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kustomize, kubeconform 설치
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kustomize
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: 스키마 검사
        run: |
          set -euo pipefail
          # Argo CD Application 같은 CRD 스키마는 CRDs-catalog 에서 가져온다.
          crd='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in overlays/prod/*; do
            echo "== $dir"
            kustomize build "$dir" | kubeconform -strict -summary \
              -kubernetes-version "$K8S_VERSION" \
              -schema-location default -schema-location "$crd" -
          done
          kubeconform -strict -summary -schema-location default -schema-location "$crd" argocd/applicationset.yaml argocd/project.yaml
          # ApplicationSet이 만들 Application들도 펼쳐서 검사한다.
          pip install -q -r requirements-dev.txt
          python -m tools.expand_appset | kubeconform -strict -summary -schema-location default -schema-location "$crd" -

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color
