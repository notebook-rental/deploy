apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-inference-config
data:
  APP_PROFILE: prod
  # 로그 시각을 한국 시간으로 맞춘다(python:3.12-slim 이미지에 시간대 자료 tzdata가 들어 있다).
  TZ: Asia/Seoul
  STORAGE_BUCKET: notebook-rental
  # 작업 가져가기(/internal/jobs/claim)와 활성 모델 확인에 쓰는 api 주소.
  API_BASE_URL: http://api:8080
  # 추론 스레드 수 = 파드에 준 CPU 수. requests.cpu 를 바꾸면 이 값도 같이 바꾼다.
  # (overlays/prod/ml-inference 에서 한 번에 바꾼다)
  INFERENCE_THREADS: "4"
  OMP_NUM_THREADS: "4"
  # 모델 파일을 내려받아 두는 곳(쓰기 가능한 emptyDir).
  MODEL_CACHE_DIR: /var/cache/models
  # 라이브러리가 홈 폴더 아래 캐시를 쓰려 할 때를 대비해 쓰기 가능한 곳으로 돌린다.
  XDG_CACHE_HOME: /tmp/.cache
