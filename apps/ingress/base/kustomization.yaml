apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 밖(외부 Nginx)에서 들어온 요청을 web과 api로 나눠 보내는 규칙.
# 도메인(host)은 overlays/prod/ingress 에서 붙인다.
labels:
  - pairs:
      app.kubernetes.io/name: ingress
      app.kubernetes.io/part-of: notebook-rental

resources:
  - ingress.yaml
  - ingress-sse.yaml
