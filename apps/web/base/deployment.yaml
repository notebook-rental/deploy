apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/notebook-rental/web
          env:
            # nginx 접속 로그 시각을 한국 시간으로 맞춘다(nginx-unprivileged alpine 이미지에 tzdata가 들어 있다).
            - name: TZ
              value: Asia/Seoul
          ports:
            # 비루트 nginx는 1024 미만 포트를 못 열어서 8080을 쓴다.
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 루트 파일시스템을 읽기 전용으로 두므로, nginx가 쓰는 곳만 빈 폴더(emptyDir)로 연다.
            # pid 파일은 /tmp/nginx.pid.
            - name: tmp
              mountPath: /tmp
            # 비루트 nginx 이미지(nginxinc/nginx-unprivileged)가 임시 파일을 쓰는 기본 위치.
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
